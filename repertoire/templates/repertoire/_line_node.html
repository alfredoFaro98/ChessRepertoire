<li class="line-node">
  {% with children=line.varianti.all %}
    {% if children.count %}
      <span class="toggle collapsed">▶</span>
    {% else %}
      <span class="toggle empty"></span>
    {% endif %}

    <!-- link alla linea -->
    <a href="{% url 'line_detail' line.root.id line.numero %}">
      <span class="mosse">{{ line.pgn }}</span>
    </a>

    {% if children.count %}
      <ul class="nested">
        {% for sub in children %}
          {% include "repertoire/_line_node.html" with line=sub %}
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
</li>
