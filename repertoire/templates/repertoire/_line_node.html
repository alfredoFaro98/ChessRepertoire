<li class="line-node">
  {% with children=line.varianti.all %}
    {% if children.count %}
      <span class="toggle collapsed">▶</span>
    {% else %}
      <span class="toggle empty"></span>
    {% endif %}

    <a href="{% url 'line_detail' opening.id line.id %}">
      {{ line.mosse_chiave }}
    </a>

    {% if children.count %}
      <ul class="nested">
        {% for sub in children %}
          {% include "repertoire/_line_node.html" with line=sub %}
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
</li>
