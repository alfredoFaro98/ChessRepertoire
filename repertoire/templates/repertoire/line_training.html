{% load static %}
{% get_static_prefix as STATIC_PREFIX %}
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Allenamento — {{ line.root.nome }} · Linea {{ line.numero }}</title>

<link rel="stylesheet" href="{% static 'vendor/chessboardjs/chessboard-1.0.0.min.css' %}">
<style>
  body { background:#f5f5f5; font-family:Arial, sans-serif; text-align:center; margin:0; padding:24px; }
  #board { width:480px; margin:0 auto; }
  #feedback { font-size:18px; margin-top:12px; font-weight:700; }
  .correct { color:#2e7d32; }
  .wrong   { color:#c62828; }
  .bar { width:480px; margin:10px auto 0; height:8px; background:#e0e0e0; border-radius:4px; overflow:hidden; }
  .bar > div { height:100%; width:0%; background:#43a047; transition:width .25s; }
  .toolbar { margin:10px 0 18px; display:flex; gap:8px; justify-content:center; align-items:center; }
  .btn { background:#1976d2; color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; }
  .btn:hover { background:#1565c0; }
  .btn.light { background:#eee; color:#333; }
  .btn.light:hover { background:#e0e0e0; }
  .muted { color:#666; font-size:14px; }
</style>
</head>
<body>

<h2>{{ line.root.nome }} — Linea {{ line.numero }}</h2>

<div class="toolbar">
  <button id="asWhite" class="btn light">Allena il Bianco</button>
  <button id="asBlack" class="btn light">Allena il Nero</button>
  <span class="muted">Consiglio: scegli il lato che muove per primo nella linea.</span>
</div>

<div id="board"></div>
<div class="bar"><div id="progress"></div></div>
<div id="feedback"></div>

<div style="margin-top:10px">
  <button id="restartBtn" class="btn" style="display:none;">🔁 Ricomincia</button>
  <button class="btn light" onclick="window.location.href='{% url 'line_detail' line.root.id line.numero %}'">⬅ Torna alla linea</button>
</div>

<!-- Regole -->
<script src="{% static 'vendor/chessjs/chess.min.js' %}"></script>
<!-- jQuery (alcuni build 1.0.0 di chessboard la richiedono) -->
<script src="{% static 'vendor/jquery/jquery-3.7.1.min.js' %}"></script>
<!-- UI scacchiera -->
<script src="{% static 'vendor/chessboardjs/chessboard-1.0.0.min.js' %}"></script>

<script>
(function () {
  // PNG locali: es. /static/vendor/chessboardjs/img/wP.png
  const PIECE_BASE = "{% static 'vendor/chessboardjs/img/' %}";

  // PGN -> array SAN
  const pgn = `{{ line.pgn|escapejs }}`;
  const movesSAN = pgn
    .replace(/{[^}]*}/g,'')           // commenti { ... }
    .replace(/\$\d+/g,'')             // NAGs
    .replace(/\([^)]*\)/g,'')         // varianti (se presenti)
    .replace(/\d+\.(\.\.)?/g,' ')     // numeri mosse
    .trim()
    .split(/\s+/)
    .filter(x => x && !['1-0','0-1','1/2-1/2','*'].includes(x));

  const game = new window.Chess();
  const progressEl = document.getElementById('progress');
  const feedback = document.getElementById('feedback');
  const restartBtn = document.getElementById('restartBtn');
  let sideToTrain = 'w';  // default
  let idx = 0;

  const board = Chessboard('board', {
    draggable: true,
    position: 'start',
    orientation: 'white',
    pieceTheme: piece => PIECE_BASE + piece + '.png',
    onDragStart: onDragStart,
    onDrop: onDrop,
    onMouseoverSquare: onMouseoverSquare,
    onMouseoutSquare: removeHighlights,
    onSnapEnd: () => board.position(game.fen()),
  });

  setSide('w'); // di default allena il Bianco

  // ===== Controls per scegliere il lato =====
  document.getElementById('asWhite').onclick = () => setSide('w');
  document.getElementById('asBlack').onclick = () => setSide('b');

  function setSide(side) {
    sideToTrain = side;
    game.reset();
    board.start();
    board.orientation(side === 'w' ? 'white' : 'black');
    idx = 0;
    setFeedback(`Tocca al ${side==='w'?'Bianco':'Nero'} — gioca la mossa corretta`, '');
    restartBtn.style.display = 'none';
    updateProgress();
    // se si allena il Nero, fai muovere subito il Bianco con la prima SAN
    if (side === 'b' && movesSAN.length) {
      try { game.move(movesSAN[idx]); idx++; board.position(game.fen()); } catch(e) { console.warn(e); }
    }
  }

  // ===== Helpers UI =====
  function setFeedback(text, cls){
    feedback.className = cls || '';
    feedback.textContent = text;
  }
  function updateProgress() {
    progressEl.style.width = Math.min(100, Math.round((idx / movesSAN.length) * 100)) + '%';
  }
  function squareEl(sq){ return document.querySelector('#board .square-' + sq); }
  function highlight(sq){
    const el = squareEl(sq); if (!el) return;
    const dark = el.classList.contains('black-3c85d');
    const base = dark ? '#b58863' : '#f0d9b5';
    el.style.background = `radial-gradient(circle, rgba(0,184,212,.9) 22%, ${base} 23%)`;
  }
  function removeHighlights(){
    document.querySelectorAll('#board .square-55d63').forEach(el => el.style.background = '');
  }

  // ===== Eventi chessboard =====
  function onDragStart (source, piece) {
    if (game.game_over()) return false;
    if (game.turn() !== sideToTrain) return false;              // muovi solo il tuo lato
    if (sideToTrain === 'w' && piece.startsWith('b')) return false;
    if (sideToTrain === 'b' && piece.startsWith('w')) return false;
  }

  function onDrop (source, target) {
    removeHighlights();
    const mv = game.move({ from: source, to: target, promotion: 'q' });
    if (!mv) return 'snapback'; // illegale

    const expected = movesSAN[idx] || null;
    if (!expected || mv.san !== expected) {
      game.undo();
      setFeedback(`❌ Sbagliato: dovevi giocare ${expected || '—'}`, 'wrong');
      return 'snapback';
    }

    // ✅ corretta
    idx++;
    setFeedback(`✅ Corretto: ${mv.san}`, 'correct');
    board.position(game.fen());
    updateProgress();

    // Autoplay avversario
    if (idx < movesSAN.length) {
      const replySAN = movesSAN[idx];
      try { game.move(replySAN); idx++; board.position(game.fen()); updateProgress(); }
      catch(e) { console.warn('Reply SAN non giocabile:', replySAN, e); }
    }

    if (idx >= movesSAN.length) {
      setFeedback('🎉 Linea completata!', 'correct');
      restartBtn.style.display = 'inline-block';
    }
  }

  function onMouseoverSquare (sq) {
    if (game.turn() !== sideToTrain) return;
    const legal = game.moves({ square: sq, verbose: true });
    if (!legal.length) return;
    highlight(sq);
    legal.forEach(m => highlight(m.to));
  }

  restartBtn.addEventListener('click', () => setSide(sideToTrain));
})();
</script>
</body>
</html>
